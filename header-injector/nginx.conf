events {}

http {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8089;

    location / {
      proxy_set_header X-Ontogit-User andrey;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      set $upstream http://openai-proxy:8088;
      proxy_pass $upstream;
    }
  }
}
