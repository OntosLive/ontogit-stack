services:
  header-injector:
    image: python:3.11-slim
    env_file:
    - .env
    working_dir: /app
    volumes:
    - ./header-injector:/app
    depends_on:
    - openai-proxy
    command: bash -lc "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0
      --port 8089 --access-log"
    ports:
    - 8089:8089
    restart: unless-stopped
    environment:
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-http://openai-proxy:8088}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-0}
      FALLBACK_USER: ${FALLBACK_USER:-andrey}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      ONTOS_JWT_SECRET: ${ONTOS_JWT_SECRET}
  openai-proxy:
    image: python:3.11-slim
    env_file:
    - .env
    working_dir: /app
    volumes:
    - ./openai-proxy:/app
    environment:
    - OPENAI_BASE=https://api.openai.com
    - USAGE_WRITER_URL=http://usage-writer:8091/usage
    - USAGE_WRITER_BASE=http://usage-writer:8091
    - FORCE_NON_STREAM=1
    command: bash -lc "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0
      --port 8088 --access-log"
    ports:
    - 8088:8088
    restart: unless-stopped
  usage-writer:
    image: python:3.11-slim
    working_dir: /app
    volumes:
    - ./usage-writer:/app
    - /home/ontoslive/ontos_data/ontogit-user:/ontogit_user
    environment:
    - USAGE_DB=/ontogit_user/usage.db
    - DEFAULT_LIMIT_USD=${DEFAULT_LIMIT_USD:-15}
    - DEFAULT_WARN_70=${DEFAULT_WARN_70:-0.7}
    - DEFAULT_WARN_90=${DEFAULT_WARN_90:-0.9}
    - ROLE_LOW_LIMIT_USD=${ROLE_LOW_LIMIT_USD:-5}
    - ROLE_HIGH_LIMIT_USD=${ROLE_HIGH_LIMIT_USD:-50}
    command: bash -lc "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0
      --port 8091"
    ports:
    - 8091:8091
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
    - qdrant_storage:/qdrant/storage
    ports:
    - 127.0.0.1:6333:6333
  memory-service:
    build: ./memory-service
    restart: unless-stopped
    environment:
    - QDRANT_URL=http://qdrant:6333
    - ENABLE_GIT_COMMIT=1
    - GIT_COMMITTER_NAME=OntoGit
    - GIT_COMMITTER_EMAIL=ontogit@local
    - ONTOGIT_DIR=/ontogit
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_COLLECTION=ontogit_scenes
    - EMBED_BASE_URL=${EMBED_BASE_URL}
    - EMBED_API_KEY=${EMBED_API_KEY}
    - EMBED_MODEL=${EMBED_MODEL}
    - ONTOS_SERVICE_AUTH_SECRET=${ONTOS_SERVICE_AUTH_SECRET}
    - USAGE_DB=/ontogit_user/usage.db
    - GIT_AUTHOR_NAME=OntoGit
    - GIT_AUTHOR_EMAIL=ontogit@local
    - ONTOGIT_HOST_DIR=/root/ontogit
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - /root/ontogit:/ontogit
    - /home/ontoslive/ontos_data/ontogit-user:/ontogit_user
    - ./memory-service/app:/app/app
    ports:
    - 127.0.0.1:8090:8090
volumes:
  qdrant_storage: null
