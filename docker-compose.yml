services:
  header-injector:
    build:
      context: .
      dockerfile: header-injector/Dockerfile
    env_file:
    - .env
    depends_on:
    - openai-proxy
    ports:
    - 127.0.0.1:8089:8089
    restart: unless-stopped
    environment:
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-http://openai-proxy:8088}
      ONTOGIT_DEV_FALLBACK_USER_ID: ${ONTOGIT_DEV_FALLBACK_USER_ID:-}
      USAGE_WRITER_BASE: ${USAGE_WRITER_BASE:-http://usage-writer:8091}
      ONTOGIT_LIMIT_MODE: ${ONTOGIT_LIMIT_MODE-soft}
  openai-proxy:
    build:
      context: .
      dockerfile: openai-proxy/Dockerfile
    env_file:
    - .env
    environment:
    - OPENAI_BASE=https://api.openai.com
    - USAGE_WRITER_URL=http://usage-writer:8091/usage
    - USAGE_WRITER_BASE=http://usage-writer:8091
    - FORCE_NON_STREAM=1
    - POLICY_PATH=/ontogit_user/onto_policy.yml
    - ONTOGIT_ROLE_SOURCE=${ONTOGIT_ROLE_SOURCE:-}
    - OPENWEBUI_BASE_URL=${OPENWEBUI_BASE_URL:-http://open-webui:8080}
    - ONTOGIT_DEV_FALLBACK_USER_ID=${ONTOGIT_DEV_FALLBACK_USER_ID:-}
    ports:
    - 8088:8088
    restart: unless-stopped
  usage-writer:
    build:
      context: .
      dockerfile: usage-writer/Dockerfile
    volumes:
    - /home/ontoslive/ontos_data/ontogit-user:/ontogit_user
    environment:
    - USAGE_DB=/ontogit_user/usage.db
    - POLICY_PATH=/ontogit_user/onto_policy.yml
    - ROLE_SOURCE=${ONTOGIT_ROLE_SOURCE:-openwebui}
    - OPENWEBUI_BASE_URL=${OPENWEBUI_BASE_URL:-http://open-webui:8080}
    - ONTOGIT_ROLE_ENDPOINT=${ONTOGIT_ROLE_ENDPOINT:-/api/v1/ontogit/user_role}
    - ONTOS_SERVICE_AUTH_SECRET=${ONTOS_SERVICE_AUTH_SECRET}
    - DEFAULT_LIMIT_USD=${DEFAULT_LIMIT_USD:-15}
    - DEFAULT_WARN_70=${DEFAULT_WARN_70:-0.7}
    - DEFAULT_WARN_90=${DEFAULT_WARN_90:-0.9}
    - ROLE_LOW_LIMIT_USD=${ROLE_LOW_LIMIT_USD:-5}
    - ROLE_HIGH_LIMIT_USD=${ROLE_HIGH_LIMIT_USD:-50}
    - ONTOGIT_DAILY_REQUEST_LIMIT=${ONTOGIT_DAILY_REQUEST_LIMIT-}
    - ONTOGIT_DAILY_TOKEN_LIMIT=${ONTOGIT_DAILY_TOKEN_LIMIT-}
    - ONTOGIT_LIMIT_MODE=${ONTOGIT_LIMIT_MODE-soft}
    - ONTOGIT_ADMIN_USERS=${ONTOGIT_ADMIN_USERS-}
    ports:
    - 8091:8091
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
    - qdrant_storage:/qdrant/storage
    ports:
    - 127.0.0.1:6333:6333
  memory-service:
    build: ./memory-service
    restart: unless-stopped
    environment:
    - QDRANT_URL=http://qdrant:6333
    - ENABLE_GIT_COMMIT=1
    - GIT_COMMITTER_NAME=OntoGit
    - GIT_COMMITTER_EMAIL=ontogit@local
    - ONTOGIT_DIR=/ontogit
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_COLLECTION=ontogit_scenes
    - EMBED_BASE_URL=${EMBED_BASE_URL:-}
    - EMBED_API_KEY=${EMBED_API_KEY:-}
    - EMBED_MODEL=${EMBED_MODEL:-}
    - ONTOS_SERVICE_AUTH_SECRET=${ONTOS_SERVICE_AUTH_SECRET}
    - ONTOGIT_DAILY_REQUEST_LIMIT=${ONTOGIT_DAILY_REQUEST_LIMIT-}
    - ONTOGIT_DAILY_TOKEN_LIMIT=${ONTOGIT_DAILY_TOKEN_LIMIT-}
    - ONTOGIT_LIMIT_MODE=${ONTOGIT_LIMIT_MODE-soft}
    - ONTOGIT_ADMIN_USERS=${ONTOGIT_ADMIN_USERS-}
    - ONTOGIT_ROLE_SOURCE=${ONTOGIT_ROLE_SOURCE:-}
    - USAGE_DB=/ontogit_user/usage.db
    - POLICY_PATH=/ontogit_user/onto_policy.yml
    - GIT_AUTHOR_NAME=OntoGit
    - GIT_AUTHOR_EMAIL=ontogit@local
    - ONTOGIT_HOST_DIR=/root/ontogit
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - /root/ontogit:/ontogit
    - /home/ontoslive/ontos_data/ontogit-user:/ontogit_user
    - ./common:/app/common:ro
    - ./memory-service/app:/app/app
    ports:
    - 127.0.0.1:8090:8090
volumes:
  qdrant_storage: null
