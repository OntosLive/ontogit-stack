services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # наружу не светим, только внутри docker-сети
    ports:
      - "127.0.0.1:6333:6333"

  memory-service:
    build: ./memory-service
    restart: unless-stopped
    environment:
      - ONTOGIT_DIR=/ontogit
      - QDRANT_URL=http://host.docker.internal:6333
      - QDRANT_COLLECTION=ontogit_scenes
      - EMBED_BASE_URL=${EMBED_BASE_URL}
      - EMBED_API_KEY=${EMBED_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - GIT_AUTHOR_NAME=OntoGit
      - GIT_AUTHOR_EMAIL=ontogit@local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /root/ontogit:/ontogit
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  qdrant_storage:
