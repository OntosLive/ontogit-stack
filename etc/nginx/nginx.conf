events {}
http {
  server {
    listen 80;
    location / {
      proxy_pass http://openai-proxy:8088;
      # Pass-through only; never inject a constant user id here.
      proxy_set_header X-Ontogit-User $http_x_ontogit_user;
      proxy_set_header X-OpenWebUI-User-Id $http_x_openwebui_user_id;
    }
  }
}
