services:
  open-webui:
    image: open-webui-ontogate:a95e67b96
    networks:
    - ontogit-stack_default
    ports:
    - 3000:8080
    volumes:
    - /home/ontoslive/ontos_data/openwebui-data-vps-current:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://header-injector:8089
      ENABLE_WEBSOCKET_SUPPORT: 'false'
      WHISPER_MODEL: medium
      WHISPER_DEVICE: ${ALBA_STT_DEVICE}
      WHISPER_COMPUTE_TYPE: ${ALBA_STT_COMPUTE}
      WHISPER_MODEL_DIR: /app/backend/data/cache/whisper/models
      WHISPER_LANGUAGE_AUTO_IF_RU: 1
      WHISPER_BEAM_SIZE: '5'
      WHISPER_TEMPERATURE: '0.0'
      WHISPER_BEST_OF: '3'
      WHISPER_INITIAL_PROMPT: ''
      RECALL_MAX_TOKENS: '1500'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /app/backend/data/hf-cache
      HUGGINGFACE_HUB_CACHE: /app/backend/data/hf-cache/hub
    env_file:
    - .env.stt
    - .env.local
    gpus: all
networks:
  ontogit-stack_default:
    external: true
